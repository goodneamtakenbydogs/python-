[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "study-results-demo"
version = "0.1.0"
description = "A small, local teaching tool for summarizing fictional test results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
study-results = "study_results.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.16.1,<0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/study_results"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/examples", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
